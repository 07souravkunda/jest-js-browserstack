name: node-minimal-base-windows

# Builds a minimal, size-optimised 32-bit (x86) Node.js for Windows. A 32-bit
# node.exe runs on 64-bit Windows (WoW64), Windows on ARM (x86 emulation) and
# 32-bit Windows. See node-minimal-base-windows/README.md.
on:
  push:
    branches: [node-minimal-base]
    paths:
      - 'node-minimal-base-windows/**'
      - '.github/workflows/node-minimal-base-windows.yml'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version (no leading v)'
        default: '22.23.3'

permissions:
  contents: read

jobs:
  win-x86:
    # Node 22's vcbuild needs Visual Studio 2022; windows-2022 ships it.
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      NODE_VERSION: ${{ inputs.node_version || '22.23.3' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate node_version
        run: |
          [[ "$NODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid node_version: $NODE_VERSION" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install NASM (OpenSSL assembly)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Fetch and verify Node.js source
        run: |
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep " node-v${NODE_VERSION}.tar.gz\$" SHASUMS256.txt | sha256sum -c -
          tar -xzf "node-v${NODE_VERSION}.tar.gz"

      - name: Build minimal Node.js (x86)
        shell: cmd
        run: call node-minimal-base-windows\build.cmd

      - name: Smoke test (WoW64 on the 64-bit runner)
        run: |
          N="node-v${NODE_VERSION}/out/Release/node.exe"
          [ -f "$N" ] || N="node-v${NODE_VERSION}/Release/node.exe"
          "$N" -p "process.version + ' ' + process.arch + ' intl=' + typeof Intl + ' sea=' + !!process.getBuiltinModule('node:sea')"
          test "$("$N" -p process.arch)" = "ia32"
          echo 'require("fs").writeFileSync("NODE_OPTIONS_WAS_HONOURED", "x")' > inject.js
          NODE_OPTIONS="--require ./inject.js" "$N" -e "0"
          if [ -f NODE_OPTIONS_WAS_HONOURED ]; then echo "NODE_OPTIONS was honoured" >&2; exit 1; fi
          mkdir -p out
          cp "$N" "out/node-v${NODE_VERSION}-minimal-win-x86.exe"

      - name: Checksums and size
        run: |
          cd out
          7z a -tzip -mx=9 "node-v${NODE_VERSION}-minimal-win-x86.zip" "node-v${NODE_VERSION}-minimal-win-x86.exe" > /dev/null
          sha256sum node-v* > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-v${{ env.NODE_VERSION }}-minimal-win-x86
          path: out/
          retention-days: 30
